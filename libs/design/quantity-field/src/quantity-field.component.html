@if (showSelectField) {
  <daff-quantity-select
    [min]="min"
    [max]="_maxFloor"
    [extendable]="max > selectMax"
    (focusChange)="onChildFocus()"
    (blurChange)="onChildBlur()"
    (valueChange)="onChildValueChange($event)">
  </daff-quantity-select>
}
@if (showInputField) {
  <daff-quantity-input
    [min]="min"
    [max]="max"
    [quantity]="quantity"
    (focusChange)="onChildFocus()"
    (blurChange)="onChildBlur()"
    (valueChange)="onChildValueChange($event)">
  </daff-quantity-input>
}
