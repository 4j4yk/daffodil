name: E2E Commerce Install Test

on:
  push:
    branches:
      - add_commerce_schematic_test
jobs:
  test_commerce_install:
    name: Test Commerce Package Install
    runs-on: ubuntu-latest

    services:
      verdaccio:
        image: verdaccio/verdaccio:latest
        ports:
          - 4873:4873

    strategy:
      matrix:
        node: [20.19.x]

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - uses: graycoreio/github-actions/setup-node@main
      with:
        node-version: ${{ matrix.node }}
        use-stamp-cache: true

    - uses: graycoreio/daffodil/.github/actions/setup-nx-remote-cache@develop
      with:
        cache-mode: 'read-only'
        read-only-azure-connection-string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        read-write-azure-connection-string: ${{ secrets.AZURE_NX_CACHE_READWRITE_CONNECTION_STRING }}
        event-name: ${{ github.event_name }}

    # Build all packages
    - name: Build packages
      run: npx nx run-many -t build --parallel=1

    # Publish packages to Verdaccio
    - name: Publish packages to Verdaccio
      run: |
        npm set registry http://localhost:4873/
        for package in dist/libs/*; do
          if [ -d "$package" ]; then
            cd "$package"
            npm publish --registry http://localhost:4873/
            cd -
          fi
        done

    # Create Angular 20 app in temp directory
    - name: Create Angular 20 app
      working-directory: /tmp
      run: |
        npm set registry http://localhost:4873/
        npx @angular/cli@^20.0.0 new test-app --skip-git --package-manager=npm --style=scss --routing=true

    # Install and run @daffodil/commerce schematic
    - name: Install @daffodil/commerce
      working-directory: /tmp/test-app
      run: |
        npm set registry http://localhost:4873/
        npm install @daffodil/commerce

    - name: Run commerce schematic
      working-directory: /tmp/test-app
      run: npx ng add @daffodil/commerce

